name: LobeHub Offline Deployment Package

on:
  workflow_dispatch:
    inputs:
      lobe_version:
        description: 'LobeHub version tag (e.g., latest, 1.77.9)'
        required: true
        default: 'latest'
      postgres_version:
        description: 'PostgreSQL version (e.g., 15)'
        required: true
        default: '15'
      minio_version:
        description: 'MinIO version (e.g., RELEASE.2023-09-15T19-58-50Z)'
        required: true
        default: 'RELEASE.2023-09-15T19-58-50Z'

jobs:
  create-offline-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull LobeHub Docker images
        run: |
          # Pull main LobeHub image (using the new recommended image name)
          docker pull lobehub/lobehub:${{ inputs.lobe_version }} || docker pull lobehub/lobe-chat-database:${{ inputs.lobe_version }}
          
          # Pull PostgreSQL image
          docker pull postgres:${{ inputs.postgres_version }}
          
          # Pull MinIO image
          docker pull minio/minio:${{ inputs.minio_version }}

      - name: Save Docker images to tar files
        run: |
          # Save images with their respective tags
          docker save -o lobehub.tar lobehub/lobehub:${{ inputs.lobe_version }} || docker save -o lobehub.tar lobehub/lobe-chat-database:${{ inputs.lobe_version }}
          docker save -o postgres.tar postgres:${{ inputs.postgres_version }}
          docker save -o minio.tar minio/minio:${{ inputs.minio_version }}

      - name: Create docker-compose.yml
        run: |
          cat > docker-compose.yml << 'EOL'
          version: '3.8'
          services:
            lobehub:
              image: lobehub/lobehub:${{ inputs.lobe_version }}
              container_name: lobehub
              restart: always
              ports:
                - "3210:3210"
              environment:
                DATABASE_URL: postgres://lobehub:lobehub@postgres:5432/lobehub
                MINIO_ENDPOINT: minio:9000
                MINIO_ACCESS_KEY: minioadmin
                MINIO_SECRET_KEY: minioadmin
                MINIO_BUCKET: lobehub
                MINIO_USE_SSL: 'false'
                NEXTAUTH_URL: http://localhost:3210
                # 配置允许的CORS来源
                MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3210'
                # 设置访问密码（可选）
                ACCESS_CODE: your_access_code_here
              depends_on:
                - postgres
                - minio
            
            postgres:
              image: postgres:${{ inputs.postgres_version }}
              container_name: lobehub-postgres
              restart: always
              environment:
                POSTGRES_USER: lobehub
                POSTGRES_PASSWORD: lobehub
                POSTGRES_DB: lobehub
              volumes:
                - postgres-/var/lib/postgresql/data
            
            minio:
              image: minio/minio:${{ inputs.minio_version }}
              container_name: lobehub-minio
              restart: always
              command: server /data --console-address ":9001"
              environment:
                MINIO_ROOT_USER: minioadmin
                MINIO_ROOT_PASSWORD: minioadmin
              ports:
                - "9000:9000"
                - "9001:9001"
              volumes:
                - minio-data:/data
          
          volumes:
            postgres-
            minio-data:
          EOL

      - name: Create import-and-deploy.sh script
        run: |
          cat > import-and-deploy.sh << 'EOL'
          #!/bin/bash
          set -e
          
          echo "开始导入Docker镜像..."
          
          # 导入镜像
          docker load -i lobehub.tar
          docker load -i postgres.tar
          docker load -i minio.tar
          
          echo "镜像导入完成，开始部署LobeHub..."
          
          # 启动服务
          docker-compose up -d
          
          echo "LobeHub已成功部署！"
          echo "访问地址: http://localhost:3210"
          echo "默认访问密码: your_access_code_here (请在docker-compose.yml中修改)"
          
          # 提供基本使用说明
          echo -e "\n首次登录提示:"
          echo "1. 打开浏览器访问 http://localhost:3210"
          echo "2. 当提示输入密码时，使用docker-compose.yml中设置的ACCESS_CODE值"
          echo "3. 如果需要修改配置，编辑docker-compose.yml后运行: docker-compose up -d --force-recreate"
          EOL
          chmod +x import-and-deploy.sh

      - name: Create README.md for the package
        run: |
          cat > README.md << 'EOL'
          # LobeHub 离线部署包说明

          ## 部署步骤

          1. 将此压缩包传输到内网服务器
          2. 解压压缩包: `unzip lobehub-offline-deploy.zip`
          3. 进入解压后的目录: `cd lobehub-offline-deploy`
          4. 根据需要修改 `docker-compose.yml` 中的配置（特别是 ACCESS_CODE）
          5. 运行部署脚本: `./import-and-deploy.sh`

          ## 注意事项
          - 首次登录时需要输入访问密码（ACCESS_CODE）
          - 如果修改了配置，可使用 `docker-compose up -d --force-recreate` 重新部署
          - 数据将持久化存储在 Docker 卷中，升级时不会丢失 [[11]]
          EOL

      - name: Package all files
        run: |
          mkdir -p lobehub-offline-deploy
          mv docker-compose.yml import-and-deploy.sh README.md lobehub.tar postgres.tar minio.tar lobehub-offline-deploy/
          zip -r lobehub-offline-deploy.zip lobehub-offline-deploy

      - name: Upload deployment package
        uses: actions/upload-artifact@v3
        with:
          name: lobehub-offline-deploy-package
          path: lobehub-offline-deploy.zip
