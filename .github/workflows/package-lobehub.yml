name: 打包 LobeHub 离线部署包

on:
  # 您可以手动触发工作流
  workflow_dispatch:
    inputs:
      lobe_version:
        description: 'LobeHub 镜像版本 (例如: latest, 1.0.0)'
        required: true
        default: 'latest'
      server_ip:
        description: '内网服务器IP (用于端口模式配置)'
        required: true
        default: '192.168.1.100'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置环境
        run: |
          mkdir -p lobehub-offline-package
          cd lobehub-offline-package

      - name: 下载 Docker Compose 配置文件
        run: |
          cd lobehub-offline-package
          # 下载官方推荐的 compose 文件和环境变量示例
          curl -O https://raw.githubusercontent.com/lobehub/lobe-chat/HEAD/docker-compose/deploy/docker-compose.yml
          curl -O https://raw.githubusercontent.com/lobehub/lobe-chat/HEAD/docker-compose/deploy/.env.zh-CN.example
          # 重命名环境变量文件
          mv .env.zh-CN.example .env

      - name: 修改配置为端口模式（适配内网）
        run: |
          cd lobehub-offline-package
          # 1. 修改 .env 文件，设置服务端口和 S3 的 Endpoint
          #    假设内网服务器IP为 ${{ github.event.inputs.server_ip }}
          SERVER_IP="${{ github.event.inputs.server_ip }}"
          
          # 设置 LobeHub 的访问地址和端口
          echo "APP_URL=http://${SERVER_IP}:3210" >> .env
          # 设置 S3 的 Endpoint，让浏览器能直接访问
          echo "S3_ENDPOINT=http://${SERVER_IP}:9000" >> .env
          # 可选：生成随机的数据库和密钥密码（这里用简单示例，生产环境建议复杂化）
          echo "POSTGRES_PASSWORD=$(openssl rand -base64 12)" >> .env
          echo "KEY_VAULTS_SECRET=$(openssl rand -base64 32)" >> .env
          echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> .env
          
          # 2. 修改 docker-compose.yml 中可能的端口绑定，确保与上面一致（通常默认已是 3210:3210, 9000:9000）
          #    此步骤可选，因为官方 compose 文件默认已映射这些端口。

      - name: 拉取 Docker 镜像
        run: |
          cd lobehub-offline-package
          # 定义所有需要的镜像
          # 从 docker-compose.yml 中提取镜像列表，或手动指定
          IMAGES=(
            "lobehub/lobe-chat:${{ github.event.inputs.lobe_version }}"
            "postgres:15"
            "minio/minio:latest"
          )
          
          # 拉取并保存每个镜像
          for IMAGE in "${IMAGES[@]}"; do
            echo "拉取镜像: $IMAGE"
            docker pull $IMAGE
            # 将镜像保存为 tar 文件，文件名中的斜杠替换为下划线
            FILENAME=$(echo $IMAGE | tr '/' '_' | tr ':' '_')
            docker save $IMAGE | gzip > "${FILENAME}.tar.gz"
          done

      - name: 准备部署脚本
        run: |
          cd lobehub-offline-package
          cat > deploy-offline.sh << 'EOF'
          #!/bin/bash
          # 离线部署脚本
          echo "开始加载 Docker 镜像..."
          for image_tar in *.tar.gz; do
            echo "加载 $image_tar"
            docker load < $image_tar
          done
          
          echo "启动 LobeHub 服务..."
          # 确保当前目录下有 docker-compose.yml 和 .env
          docker compose up -d
          
          echo "部署完成。"
          echo "请检查服务状态: docker compose ps"
          echo "访问地址: http://$(grep APP_URL .env | cut -d '=' -f2)"
          EOF
          
          chmod +x deploy-offline.sh

      - name: 打包所有文件
        run: |
          # 将所有内容打包成一个压缩文件
          tar -czvf lobehub-offline-package.tar.gz lobehub-offline-package/

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: lobehub-offline-package
          path: lobehub-offline-package.tar.gz
