name: Build Dyad for ubuntu22.04

on:
  workflow_dispatch:          # 手动触发，方便控制
  push:
    branches: [ main ]        # 可选：自动更新离线包

jobs:
  build-offline:
    runs-on: ubuntu-22.04     # 与容器 OS 一致
    steps:
      - name: Checkout dyad project
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad
          path: dyad

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'        # 自动缓存 ~/.npm，但为了完整打包仍会额外打包
          cache-dependency-path: dyad/package-lock.json

      - name: Install dependencies (full)
        working-directory: ./dyad
        run: npm ci            # 使用 lock 文件保证版本一致性，若无 lock 则用 npm install

      - name: Pack node_modules and npm cache
        working-directory: ./dyad
        run: |
          # 打包 node_modules（保留符号链接，适合原生模块）
          tar -czf ../dyad_node_modules.tar.gz node_modules/
          # 打包 npm 全局缓存（包含所有已下载的 tarball）
          tar -czf ../npm_cache.tar.gz -C ~ .npm
          # 额外打包整个项目（可选，方便还原）
          tar -czf ../dyad_project_source.tar.gz --exclude=node_modules --exclude=.git .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dyad-offline-packages
          path: |
            dyad_node_modules.tar.gz
            npm_cache.tar.gz
            dyad_project_source.tar.gz
          retention-days: 7
