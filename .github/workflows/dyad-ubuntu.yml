name: Build Dyad for ubuntu20.04

on:
  workflow_dispatch:          # 手动触发，方便控制

jobs:
  build-offline:
    runs-on: ubuntu-20.04    # 与内网环境操作系统一致

    steps:
      - name: Checkout dyad repository
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad   # 直接拉取 dyad 项目
          # 如果需要特定分支或 tag，可以添加 ref 参数，例如：
          ref: main

      - name: Setup Node.js (exact version for offline machine)
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'   # 与内网机器 Node 版本完全一致
          cache: 'npm'              # 可选，加速后续 install

      - name: Install system build tools (required by node-gyp)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install npm dependencies
        run: npm install
        # 若项目有 .npmrc 或需要特殊配置，请在此处调整

      - name: Package entire project with node_modules
        run: |
          # 生成离线包，排除不必要的缓存和 git 信息
          tar -czf dyad-offline.tar.gz \
            --exclude='.git' \
            --exclude='node_modules/.cache' \
            --exclude='*.log' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyad-offline-package
          path: dyad-offline.tar.gz
          if-no-files-found: error
