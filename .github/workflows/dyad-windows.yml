name: Build Dyad for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout dyad
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'

      - name: Install dependencies
        run: npm install

      - name: Package with tar
        run: |
          tar -czf dyad-windows.tar.gz --exclude=dyad-windows.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyad-windows
          path: dyad-windows.tar.gz
