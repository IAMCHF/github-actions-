name: Build Dyad for windows

on:
  workflow_dispatch:          # 手动触发，便于控制

jobs:
  build:
    runs-on: windows-2022   # 确保与目标环境一致（Windows）
    steps:
      - name: Checkout dyad repository
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad   # 如果 workflow 放在自己的仓库，需指定外部仓库
          ref: 'v0.41.0'                # 指定 tag，例如 'v0.1.0' 或具体版本号
          # 如果当前仓库就是 dyad 的 fork，可以去掉 repository 行

      - name: Setup Node.js (matching target version)
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'    # 与内网机器 Node 版本一致

      - name: Configure cache directories (inside project)
        shell: pwsh
        run: |
          # 在项目根目录下创建 .cache 文件夹用于存放所有缓存
          New-Item -ItemType Directory -Force -Path .cache\npm
          New-Item -ItemType Directory -Force -Path .cache\node-gyp
          New-Item -ItemType Directory -Force -Path .cache\electron
          New-Item -ItemType Directory -Force -Path .cache\electron-builder

          # 设置环境变量，使后续命令使用这些缓存目录
          echo "NPM_CONFIG_CACHE=$(Resolve-Path .cache\npm)" >> $env:GITHUB_ENV
          echo "npm_config_cache=$(Resolve-Path .cache\npm)" >> $env:GITHUB_ENV   # 兼容某些工具
          echo "NODE_GYP_CACHE=$(Resolve-Path .cache\node-gyp)" >> $env:GITHUB_ENV
          echo "ELECTRON_CACHE=$(Resolve-Path .cache\electron)" >> $env:GITHUB_ENV
          echo "ELECTRON_BUILDER_CACHE=$(Resolve-Path .cache\electron-builder)" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Run npm start (limited to 90 seconds)
        shell: pwsh
        run: |
          # 使用 cmd /c 调用 npm start，确保可执行
          Write-Host "Starting electron-forge via npm start..."
          $process = Start-Process -FilePath "cmd" -ArgumentList "/c npm start" -NoNewWindow -PassThru
          
          Write-Host "Waiting 90 seconds for downloads and compilations..."
          Start-Sleep -Seconds 90
          
          # 终止主进程及其所有子进程
          Write-Host "Stopping the process tree..."
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          # 额外清理可能遗留的 node 或 electron 进程（避免文件锁定）
          Get-Process -Name "node","electron" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          
          Write-Host "Execution stopped after 60 seconds."

      - name: Prepare archive
        shell: pwsh
        run: |
          # 将项目所有文件（包括 node_modules 和 .cache）打包
          # 注意排除 .git 目录以减少体积
          $exclude = @('*.git', '*.github')   # 可根据需要调整
          $source = '.'
          $destination = 'dyad-offline-bundle.tar.gz'
          # 使用 tar 打包（Windows 10 1803+ 自带 tar 命令）
          tar -czf $destination --exclude='.git' --exclude='.github' --exclude='*.tar.gz' $source
          # 验证文件大小
          Get-Item $destination | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyad-offline-bundle
          path: dyad-offline-bundle.tar.gz
          retention-days: 7   # 根据需要保留
