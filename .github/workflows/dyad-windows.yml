name: Build Dyad for Windows

on:
  workflow_dispatch:          # 手动触发，便于灵活控制

jobs:
  build:
    runs-on: windows-2022    # 关键：必须与内网环境一致
    steps:
      - name: Checkout dyad
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad   # 直接拉取 dyad 仓库
          ref: main                   # 可指定分支或 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'     # 与你内网环境 Node 版本保持一致

      - name: Install dependencies
        run: npm install
        # 如果需要使用内网镜像源，可在此添加 npm config set registry

      - name: Pack node_modules and source
        run: |
          Compress-Archive -Path .\* -DestinationPath dyad-windows.zip -Force
        # 打包整个项目（包含 node_modules），确保所有依赖完整

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyad-windows
          path: dyad-windows.zip
