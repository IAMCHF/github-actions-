name: Build Dyad for windows-make v3

on:
  workflow_dispatch:          # 手动触发

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout dyad repository
        uses: actions/checkout@v4
        with:
          repository: dyad-sh/dyad
          ref: 'v0.41.0'

      - name: Setup Node.js (matching target version)
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'

      # ----- 简化：只设置 npm 缓存和 electron 缓存到项目内 -----
      - name: Configure caches inside project
        shell: pwsh
        run: |
          # 创建两个缓存目录
          New-Item -ItemType Directory -Force -Path .npm-cache
          New-Item -ItemType Directory -Force -Path .electron-cache

          # 设置环境变量，后续 npm / electron 会自动使用
          echo "npm_config_cache=$(Resolve-Path .npm-cache)" >> $env:GITHUB_ENV
          echo "ELECTRON_CACHE=$(Resolve-Path .electron-cache)" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm install

      # ----- 原有逻辑：运行 npm start 90秒（触发 electron 下载和编译）-----
      - name: Run npm start (limited to 90 seconds)
        shell: pwsh
        run: |
          Write-Host "Starting electron-forge via npm start..."
          $process = Start-Process -FilePath "cmd" -ArgumentList "/c npm start" -NoNewWindow -PassThru
          Write-Host "Waiting 90 seconds for downloads and compilations..."
          Start-Sleep -Seconds 90
          Write-Host "Stopping the process tree..."
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name "node","electron" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Execution stopped after 90 seconds."

      # ----- 完整执行 npm run make（确保所有构建依赖已缓存）-----
      - name: Run npm make
        run: npm run make

      # ----- 打包整个项目（包括 node_modules 和两个缓存目录）-----
      - name: Prepare archive
        shell: pwsh
        run: |
          # 排除 .git 和 .github 减少体积
          tar -czf dyad-offline-bundle.tar.gz `
              --exclude='.git' `
              --exclude='.github' `
              --exclude='*.tar.gz' `
              .
          Get-Item dyad-offline-bundle.tar.gz | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyad-offline-bundle
          path: dyad-offline-bundle.tar.gz
          retention-days: 7
